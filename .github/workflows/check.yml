name: Reproducible checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm run evaluate
      - run: npm run build
      - run: git diff --exit-code -- frontend/public/data/evaluation.json dist docs/evaluation-windows.csv
